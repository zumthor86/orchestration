# Conductor deployment (feature 003-ingest-core-orchestration).
# Trigger-only, like all four stage deployments (hermes-ingest, hephaestus-ingest,
# hephaestus-surface, hermes-screen) it invokes in order.
#
# UNSCHEDULED as of 2026-08-03 (deliberate — was the only Prefect-level cron
# schedule in the workspace, 02:00 ET nightly). A machine sleep during an
# overnight run caused a 10-hour stall, and because nothing prevented overlap,
# the next scheduled run fired the instant the machine woke — two full pipeline
# runs collided over the same EODHD rate limit and DB. Runs are ad hoc
# (`prefect deployment run 'daily-quant-pipeline/daily-quant-pipeline'`) until
# there's a way to guarantee the run environment stays awake and a concurrency
# limit prevents overlapping runs. Re-adding a schedule later is one `schedules:`
# block away — see git history for the exact cron entry this replaced.
name: orchestration
prefect-version: ">=3.0"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: C:\Users\Christopher\Documents\python\orchestration

deployments:
  - name: daily-quant-pipeline
    description: "Ad hoc entry point: hermes-ingest -> hephaestus-ingest -> hephaestus-surface -> hermes-screen, gated on Completed. Trigger manually — see prefect.yaml header for why this isn't scheduled."
    entrypoint: daily_pipeline.py:daily_pipeline
    schedules: []
    parameters: {}
    work_pool:
      name: orchestration-pool
