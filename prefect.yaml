# Conductor deployment (feature 003-ingest-core-orchestration).
# THE ONLY SCHEDULED DEPLOYMENT in the whole pipeline (FR-010) — all four
# stage deployments (hermes-ingest, hephaestus-ingest, hephaestus-surface,
# hermes-screen) are trigger-only and are invoked by this flow in order.
name: orchestration
prefect-version: ">=3.0"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: C:\Users\Christopher\Documents\python\orchestration

deployments:
  - name: daily-quant-pipeline
    description: "Single scheduled entry point: hermes-ingest -> hephaestus-ingest -> hephaestus-surface -> hermes-screen, gated on Completed."
    entrypoint: daily_pipeline.py:daily_pipeline
    schedules:
      # 02:00 ET nightly (matches the retired Hephaestus gap-fill-daily cadence:
      # options EOD data lands late evening; at 02:00 the "latest trading day"
      # resolves to the just-closed session for every stage). Tune as needed.
      - cron: "0 2 * * *"
        timezone: "America/New_York"
    parameters: {}
    work_pool:
      name: orchestration-pool
